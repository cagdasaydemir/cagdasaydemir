name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate 3d contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: cagdasaydemir
      # The tool only sees public repositories in its language ring; redraw it.
      - name: Redraw language ring
        env:
          GH_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
          GH_USER: cagdasaydemir
          EXCLUDE_REPOS: senedit-design-gallery, web-design-references
        run: python3 .github/scripts/fix_3d_languages.py
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update 3d contribution graph"
          git push
